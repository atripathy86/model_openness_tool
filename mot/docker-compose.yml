services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mot}
      POSTGRES_USER: ${POSTGRES_USER:-mot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mot-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mot-postgres:/var/lib/postgresql/data

volumes:
  mot-postgres:
