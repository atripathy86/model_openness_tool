[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "model-openness-tool"
version = "0.1.0"
description = "Evidence-backed Model Openness Framework evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "atripathy86", email = "atripathy86@gmail.com" },
]
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=1.23,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
]

[project.scripts]
mot = "model_openness_tool.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_openness_tool"]

[tool.hatch.build.targets.sdist]
include = [
  "src/model_openness_tool",
  "tests",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["model_openness_tool"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["model_openness_tool"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
